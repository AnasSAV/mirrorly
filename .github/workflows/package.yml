# Build the release packages (installer, portable zip, checksums) on a
# clean machine, exactly as packaging/build-release.ps1 does locally, and
# keep them as workflow artifacts. Run it by hand (Actions › Package › Run
# workflow), and it runs for every version tag (v*).
#
# It does not publish anything: a release is still made with
# `gh release create` (see the wiki's "Releases" page). It shows that a
# release builds from the repository alone, on a machine with nothing
# preinstalled, and its packages can be downloaded to try a build.

name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Puts Microsoft's link.exe and the MSVC headers first (the runner's
      # Git also has a link.exe); build-release.ps1 sees it and uses it.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust (stable)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: FFmpeg from cache
        id: ffmpeg
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('packaging/ffmpeg.txt') }}

      # The exact build pinned in packaging/ffmpeg.txt, checked by SHA-256.
      - name: Download FFmpeg 9.0 (LGPL, shared)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./packaging/get-ffmpeg.ps1

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Packaging tools (cargo-about, Inno Setup)
        shell: pwsh
        run: |
          cargo install cargo-about --features cli --locked
          choco install innosetup --no-progress -y

      - name: Build the packages
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build-release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: mirrorly-${{ github.ref_name }}
          path: |
            dist/Mirrorly-Setup-*.exe
            dist/Mirrorly-*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
