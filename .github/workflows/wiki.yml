# The wiki's pages live in docs/wiki, reviewed and versioned with the code.
# A push to main that changes them publishes them to the GitHub wiki: the
# wiki ends up exactly as docs/wiki (pages removed there go from the wiki).
#
# The wiki's git repository only exists once its first page has been made
# in the web UI (Wiki › Create the first page); until then this fails with
# "repository not found".

name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish docs/wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push the pages to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
          else
            git commit -m "Wiki from ${SHA::7}"
            git push
          fi
