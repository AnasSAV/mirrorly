[package]
name = "app"
version = "0.5.0"
authors = ["AnasSAV"]
edition.workspace = true
license.workspace = true
publish = false
description = "Mirrorly: mirror and control an iPhone from Windows, and use an iPad as a second display"

[[bin]]
name = "Mirrorly"
path = "src/main.rs"

[dependencies]
device.workspace = true
video.workspace = true
input.workspace = true
display.workspace = true
winit.workspace = true
windows.workspace = true
# Direct2D's point types; must match the version `windows` uses.
windows-numerics = "=0.3.1"
# Windows clipboard bitmaps (CF_DIB) -> PNG for the iPhone.
png = "0.17"

anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
winresource = "=0.1.34"
