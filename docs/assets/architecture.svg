    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
  </defs>
  <rect width="960" height="440" rx="24" fill="url(#bg)" stroke="var(--cardline)"/>
<rect x="32" y="52" width="232" height="356" rx="20" fill="var(--hair)" fill-opacity="var(--hairop)" stroke="var(--cardline)"/><text x="52" y="84" font-size="12" font-weight="700" letter-spacing="1.4" fill="var(--accent)">IPHONE</text>
<rect x="52" y="102" width="192" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="68" y="132" font-size="15" font-weight="600" fill="var(--ink)">Screen</text><text x="68" y="154" font-size="12.5" fill="var(--soft)">displayservice · HEVC video</text>
<rect x="52" y="200" width="192" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="68" y="230" font-size="15" font-weight="600" fill="var(--ink)">Input</text><text x="68" y="252" font-size="12.5" fill="var(--soft)">touch · keys · buttons (HID)</text>
<rect x="52" y="298" width="192" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="68" y="328" font-size="15" font-weight="600" fill="var(--ink)">Clipboard and files</text><text x="68" y="350" font-size="12.5" fill="var(--soft)">pasteboard · house_arrest</text>
<rect x="288" y="52" width="34" height="356" rx="17" fill="var(--deep)"/><text transform="translate(310 230) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="var(--ondeep)">USB  ·  WI-FI TUNNEL</text>
<rect x="346" y="52" width="582" height="356" rx="20" fill="var(--tint)" stroke="var(--tintline)"/><text x="366" y="84" font-size="12" font-weight="700" letter-spacing="1.4" fill="var(--accent)">MIRRORLY ON WINDOWS · 4 THREADS</text>
<rect x="366" y="102" width="168" height="274" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="382" y="132" font-size="15" font-weight="600" fill="var(--ink)">network</text><text x="382" y="154" font-size="12.5" fill="var(--soft)">tunnel · RTP · RTCP</text><text x="382" y="174" font-size="12.5" fill="var(--soft)">input sender</text><text x="382" y="194" font-size="12.5" fill="var(--soft)">clipboard bridge</text><text x="382" y="214" font-size="12.5" fill="var(--soft)">USB / Wi-Fi switching</text>
<rect x="580" y="102" width="150" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="596" y="132" font-size="15" font-weight="600" fill="var(--ink)">decode</text><text x="596" y="154" font-size="12.5" fill="var(--soft)">FFmpeg d3d11va</text>
<rect x="760" y="102" width="150" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="776" y="132" font-size="15" font-weight="600" fill="var(--ink)">present</text><text x="776" y="154" font-size="12.5" fill="var(--soft)">flip-model swapchain</text>
<rect x="580" y="298" width="330" height="78" rx="12" fill="var(--card)" stroke="var(--cardline)"/><text x="596" y="328" font-size="15" font-weight="600" fill="var(--ink)">main</text><text x="596" y="350" font-size="12.5" fill="var(--soft)">window · mouse and keyboard · drag and drop</text>
<text x="580" y="232" font-size="13" fill="var(--soft)">Video and input travel separately:</text><text x="580" y="252" font-size="13" fill="var(--soft)">a click never waits behind a frame.</text>
