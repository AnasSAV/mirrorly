<text x="266" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">video</text><text x="266" y="230" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">touch</text><text x="266" y="328" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">files</text><text x="557" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">frames</text><text x="557" y="328" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)">input</text>
<text x="835" y="224" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--accent)">your screen</text>
