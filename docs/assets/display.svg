<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#141a35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#7B4DF2"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA2E8"/>
    </marker>
  </defs>

  <rect width="960" height="456" rx="24" fill="url(#bg)"/>

  <!-- The PC -->
  <g transform="translate(70 40)">
    <rect width="300" height="188" rx="12" fill="#0B1020" stroke="#3A4466" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="168" rx="4" fill="url(#wall)"/>
    <rect x="28" y="30" width="150" height="96" rx="6" fill="#F8FAFF" fill-opacity="0.92"/>
    <rect x="28" y="30" width="150" height="16" rx="6" fill="#DCE3F8"/>
    <rect x="40" y="58" width="96" height="6" rx="3" fill="#94A3C8"/>
    <rect x="40" y="72" width="120" height="6" rx="3" fill="#B8C3DE"/>
    <rect x="40" y="86" width="80" height="6" rx="3" fill="#B8C3DE"/>
    <rect x="10" y="166" width="280" height="12" fill="#0B1020" fill-opacity="0.55"/>
    <path d="M-20 196 H320 L304 210 H-4 Z" fill="#2A3352"/>
    <text x="150" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Your PC</text>
    <text x="150" y="260" text-anchor="middle" font-size="13" fill="#A3ADD6">mouse and keyboard as usual</text>
  </g>

  <!-- Link -->
  <path d="M400 128 H566" stroke="#8FA2E8" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="408" y="92" width="150" height="26" rx="13" fill="url(#blue)"/>
  <text x="483" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Wi-Fi · 60 fps</text>
  <text x="483" y="152" text-anchor="middle" font-size="12.5" fill="#A3ADD6">the desktop extends</text>
  <text x="483" y="170" text-anchor="middle" font-size="12.5" fill="#A3ADD6">onto the iPad</text>

  <!-- The iPad, landscape -->
  <g transform="translate(590 46)">
    <rect width="300" height="212" rx="20" fill="#0B1020" stroke="#3A4466" stroke-width="2"/>
    <rect x="14" y="14" width="272" height="184" rx="8" fill="url(#wall)"/>
    <rect x="70" y="44" width="170" height="110" rx="6" fill="#F8FAFF" fill-opacity="0.92"/>
    <rect x="70" y="44" width="170" height="16" rx="6" fill="#DCE3F8"/>
    <rect x="84" y="74" width="110" height="6" rx="3" fill="#94A3C8"/>
    <rect x="84" y="88" width="136" height="6" rx="3" fill="#B8C3DE"/>
    <rect x="84" y="102" width="92" height="6" rx="3" fill="#B8C3DE"/>
    <rect x="84" y="122" width="56" height="18" rx="9" fill="#4C61FA"/>
    <!-- pointer -->
    <path d="M150 128 l0 22 l6 -6 l5 10 l4 -2 l-5 -10 l8 0 z" fill="#fff" stroke="#111" stroke-width="1.2"/>
    <text x="150" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Your iPad</text>
    <text x="150" y="254" text-anchor="middle" font-size="13" fill="#A3ADD6">a second screen, in Safari</text>
  </g>

  <!-- Pipeline -->
  <g font-size="13">
    <g transform="translate(32 346)">
      <rect width="164" height="78" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="28" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7C8BC9">1 · WINDOWS</text>
      <text x="16" y="50" font-weight="600" fill="#fff">Virtual monitor</text>
      <text x="16" y="68" fill="#A3ADD6">on only while in use</text>
    </g>
    <g transform="translate(216 346)">
      <rect width="164" height="78" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="28" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7C8BC9">2 · CAPTURE</text>
      <text x="16" y="50" font-weight="600" fill="#fff">Desktop Duplication</text>
      <text x="16" y="68" fill="#A3ADD6">stays on the GPU</text>
    </g>
    <g transform="translate(400 346)">
      <rect width="164" height="78" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="28" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7C8BC9">3 · ENCODE</text>
      <text x="16" y="50" font-weight="600" fill="#fff">H.264 in hardware</text>
      <text x="16" y="68" fill="#A3ADD6">Quick Sync, zero-copy</text>
    </g>
    <g transform="translate(584 346)">
      <rect width="164" height="78" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="28" font-size="11" font-weight="700" letter-spacing="1.1" fill="#7C8BC9">4 · SEND</text>
      <text x="16" y="50" font-weight="600" fill="#fff">WebSocket</text>
      <text x="16" y="68" fill="#A3ADD6">never queues: skips</text>
    </g>
    <g transform="translate(768 346)">
      <rect width="160" height="78" rx="14" fill="#4C61FA" fill-opacity="0.16" stroke="#6F83FF" stroke-opacity="0.6"/>
      <text x="16" y="28" font-size="11" font-weight="700" letter-spacing="1.1" fill="#9DB0FF">5 · IPAD</text>
      <text x="16" y="50" font-weight="600" fill="#fff">Safari WebCodecs</text>
      <text x="16" y="68" fill="#C3CCF5">decode, draws pointer</text>
    </g>
  </g>
  <path d="M198 385 H212" stroke="#8FA2E8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M382 385 H396" stroke="#8FA2E8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M566 385 H580" stroke="#8FA2E8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 385 H764" stroke="#8FA2E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="328" text-anchor="middle" font-size="12.5" fill="#7C8BC9">About 12 ms on the PC from a screen change to the frame on its way (median, 2360 × 1640) · the pointer needs no frame</text>
</svg>
