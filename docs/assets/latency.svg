<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img">
  <title>How long a tap takes to show, and where the time goes</title>
  <style>
    :root { --bg1:#FBFCFD; --bg2:#E9EFF3; --card:#FFFFFF; --cardline:#D3DCE2; --ink:#20272D; --soft:#56646F; --faint:#66757F; --accent:#2F6F88; --ice:#8DC2D6; --onice:#14191D; --tint:#E1F1F7; --tintline:#8DC2D6; --deep:#37525F; --ondeep:#E4F5FA; --line:#5F8FA3; --hair:#2C3339; --hairop:0.09; --frame:#C9D3DA; --bar:#E4EAEE; --baricon:#2C3339; --barline:#BFCAD2; --badge:#2C3339; --onbadge:#F3F6F8; --desk1:#DCE4E9; --desk2:#CDD7DE; --deskitem:#2C3339; --deskop:0.14; --device:#2C3339; --deviceline:#576774; --chartphone:#576774; --onchart:#F3F6F8; --chartpc:#8DC2D6; --stage:#4F8CA6; --glow:#8DC2D6; --glowop:0.34; --mbody:#2E383F; --mring:#23282E; --mleft:#576774; --mice:#8DC2D6; --mright:#37525F; --mplay:#D2EDF5; --mmirror:#2C3339; --mly:#7FB6CA; }
    @media (prefers-color-scheme: dark) { :root { --bg1:#14181C; --bg2:#1E252B; --card:#232A30; --cardline:#3A464F; --ink:#E9F0F4; --soft:#A3B3BE; --faint:#8A9BA7; --accent:#8DC2D6; --ice:#8DC2D6; --onice:#14191D; --tint:#22343E; --tintline:#4F7A8D; --deep:#37525F; --ondeep:#E4F5FA; --line:#8DC2D6; --hair:#FFFFFF; --hairop:0.06; --frame:#1A1F24; --bar:#262D33; --baricon:#E9F0F4; --barline:#0E1114; --badge:#E9F0F4; --onbadge:#14191D; --desk1:#232A30; --desk2:#1A1F24; --deskitem:#FFFFFF; --deskop:0.11; --device:#0E1114; --deviceline:#3A464F; --chartphone:#66788A; --onchart:#FFFFFF; --chartpc:#8DC2D6; --stage:#8DC2D6; --glow:#8DC2D6; --glowop:0.16; --mbody:#66788A; --mring:#3D4954; --mleft:#8FA2B0; --mice:#8DC2D6; --mright:#37525F; --mplay:#E4F5FA; --mmirror:#E9F0F4; --mly:#8DC2D6; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
  </defs>
  <rect width="960" height="560" rx="24" fill="url(#bg)" stroke="var(--cardline)"/>
<text x="40" y="58" font-size="13" font-weight="700" letter-spacing="1.4" fill="var(--accent)">TAP → ON SCREEN</text>
<text x="40" y="86" font-size="21" font-weight="600" fill="var(--ink)">Almost all of the delay is the iPhone itself</text>
<text x="40" y="110" font-size="14" fill="var(--soft)">Median of 10 timed taps on a Calculator key, from the click to the response being shown.</text>
<path d="M170 140 V262 M330 140 V262 M490 140 V262 M650 140 V262 M810 140 V262" stroke="var(--hair)" stroke-opacity="var(--hairop)"/><text x="170" y="282" font-size="12" text-anchor="middle" fill="var(--faint)">0</text><text x="330" y="282" font-size="12" text-anchor="middle" fill="var(--faint)">25</text><text x="490" y="282" font-size="12" text-anchor="middle" fill="var(--faint)">50</text><text x="650" y="282" font-size="12" text-anchor="middle" fill="var(--faint)">75</text><text x="810" y="282" font-size="12" text-anchor="middle" fill="var(--faint)">100 ms</text>
<text x="40" y="172" font-size="15" font-weight="600" fill="var(--ink)">USB</text><rect x="170" y="152" width="555.5" height="34" rx="4" fill="var(--chartphone)"/><rect x="724.0" y="151" width="8.0" height="36" rx="3" fill="var(--bg1)"/><rect x="726.0" y="152" width="6.0" height="34" rx="3" fill="var(--chartpc)"/><text x="186" y="174" font-size="13" fill="var(--onchart)">iPhone: touch → app → screen → video encoder</text><text x="746.0" y="175" font-size="16" font-weight="700" fill="var(--ink)">87.5 ms</text>
<text x="40" y="226" font-size="15" font-weight="600" fill="var(--ink)">Wi-Fi</text><rect x="170" y="206" width="609.9" height="34" rx="4" fill="var(--chartphone)"/><rect x="779.9" y="205" width="8.4" height="36" rx="3" fill="var(--bg1)"/><rect x="781.9" y="206" width="6.4" height="34" rx="3" fill="var(--chartpc)"/><text x="186" y="228" font-size="13" fill="var(--onchart)">iPhone + Wi-Fi network</text><text x="802.3199999999999" y="229" font-size="16" font-weight="700" fill="var(--ink)">96.3 ms</text>
<rect x="40" y="304" width="14" height="14" rx="3" fill="var(--chartphone)"/><text x="62" y="316" font-size="13" fill="var(--soft)">iPhone and connection</text><rect x="232" y="304" width="14" height="14" rx="3" fill="var(--chartpc)"/><text x="254" y="316" font-size="13" fill="var(--soft)">Mirrorly on the PC (about 1 ms: receive, decode, draw; drawn wider to be seen)</text>
<path d="M40 346 H920" stroke="var(--hair)" stroke-opacity="var(--hairop)"/>
<text x="40" y="384" font-size="13" font-weight="700" letter-spacing="1.4" fill="var(--accent)">INSIDE MIRRORLY · MEDIAN PER FRAME</text>
<text x="40" y="410" font-size="14" fill="var(--soft)">Last video packet in → frame handed to the screen: <tspan fill="var(--ink)" font-weight="700">0.61 ms</tspan>. No buffering, no copies.</text>
<text x="40" y="447" font-size="14" fill="var(--ink)">Hardware decode</text><rect x="300" y="432" width="528" height="22" rx="4" fill="var(--stage)"/><text x="840" y="448" font-size="14" font-weight="700" fill="var(--ink)">0.44 ms</text>
<text x="40" y="481" font-size="14" fill="var(--ink)">Draw + Present</text><rect x="300" y="466" width="84" height="22" rx="4" fill="var(--stage)"/><text x="396" y="482" font-size="14" font-weight="700" fill="var(--ink)">0.07 ms</text>
<text x="40" y="515" font-size="14" fill="var(--ink)">Hand-offs between threads</text><rect x="300" y="500" width="96" height="22" rx="4" fill="var(--stage)"/><text x="408" y="516" font-size="14" font-weight="700" fill="var(--ink)">0.08 ms</text>
<text x="520" y="482" font-size="12.5" fill="var(--faint)">Then shown at once: Mirrorly skips the vsync wait.</text><text x="520" y="516" font-size="12.5" fill="var(--faint)">iPhone 11 · iOS 27 · Windows 11 · Intel UHD · 144 Hz</text>
</svg>
