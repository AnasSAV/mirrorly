<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#141a35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F80FF"/>
      <stop offset="1" stop-color="#7B4DF2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA2E8"/>
    </marker>
  </defs>

  <rect width="960" height="470" rx="24" fill="url(#bg)"/>

  <!-- Lane 1: iPhone -> Windows -->
  <rect x="32" y="34" width="190" height="30" rx="15" fill="url(#blue)"/>
  <text x="127" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">iPhone  →  Windows</text>

  <g font-size="14">
    <g transform="translate(32 84)">
      <rect width="264" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7C8BC9">STEP 1 · ON THE IPHONE</text>
      <text x="20" y="62" font-size="17" font-weight="600" fill="#fff">Copy it</text>
      <text x="20" y="86" fill="#A3ADD6">Photos: Share › Copy Photo</text>
      <text x="20" y="106" fill="#A3ADD6">Files: touch and hold › Copy</text>
    </g>
    <g transform="translate(348 84)">
      <rect width="264" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7C8BC9">STEP 2 · AUTOMATIC</text>
      <text x="20" y="62" font-size="17" font-weight="600" fill="#fff">Mirrorly fetches it</text>
      <text x="20" y="86" fill="#A3ADD6">Full quality, original file names.</text>
      <text x="20" y="106" fill="#A3ADD6">A 4 MB photo: under a second.</text>
    </g>
    <g transform="translate(664 84)">
      <rect width="264" height="118" rx="16" fill="#4C61FA" fill-opacity="0.16" stroke="#6F83FF" stroke-opacity="0.6"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#9DB0FF">STEP 3 · ON THE PC</text>
      <text x="20" y="62" font-size="17" font-weight="600" fill="#fff">Drag the chip out</text>
      <text x="20" y="86" fill="#C3CCF5">Onto the desktop, into Explorer,</text>
      <text x="20" y="106" fill="#C3CCF5">or into any app that takes files.</text>
    </g>
  </g>
  <path d="M300 143 H342" stroke="#8FA2E8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M616 143 H658" stroke="#8FA2E8" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Lane 2: Windows -> iPhone -->
  <rect x="32" y="244" width="190" height="30" rx="15" fill="url(#green)"/>
  <text x="127" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Windows  →  iPhone</text>

  <g font-size="14">
    <g transform="translate(32 294)">
      <rect width="264" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="34" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7C8BC9">STEP 1 · ON THE PC</text>
      <text x="20" y="62" font-size="17" font-weight="600" fill="#fff">Drop files on the window</text>
      <text x="20" y="86" fill="#A3ADD6">Drag from Explorer onto the</text>
      <text x="20" y="106" fill="#A3ADD6">mirrored screen. Up to 200 MB</text>
      <text x="20" y="126" fill="#A3ADD6">per drop.</text>
    </g>
    <g transform="translate(348 294)">
      <rect width="580" height="62" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.5"/>
      <text x="20" y="27" font-size="16" font-weight="600" fill="#fff">Photos and videos</text>
      <text x="20" y="48" fill="#B7E9D6">Pasted straight into the app you have open: a chat, a note, an email.</text>
    </g>
    <g transform="translate(348 372)">
      <rect width="580" height="62" rx="16" fill="#0EA5E9" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="20" y="27" font-size="16" font-weight="600" fill="#fff">Documents (PDF, Word, …)</text>
      <text x="20" y="48" fill="#B6E2F5">Saved with their names in a Mirrorly folder in the Files app.</text>
    </g>
  </g>
  <path d="M300 364 C 322 364, 322 325, 342 325" fill="none" stroke="#8FA2E8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M300 364 C 322 364, 322 403, 342 403" fill="none" stroke="#8FA2E8" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>
