<path d="M84 96 V70 a26 26 0 0 1 26 -26 h248 a26 26 0 0 1 26 26 V96 z" fill="var(--bar)"/><rect x="84" y="95" width="300" height="1" fill="var(--barline)"/>
<circle cx="108" cy="70" r="6.5" fill="#FF5F57"/><circle cx="128" cy="70" r="6.5" fill="#FEBC2E"/><circle cx="148" cy="70" r="6.5" fill="#28C840"/><rect x="160" y="57" width="68" height="26" rx="13" fill="var(--ice)"/><text x="194" y="74.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="var(--onice)">3 photos</text><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="245" cy="70" r="7"/></g><circle cx="245" cy="70" r="3" fill="var(--baricon)"/><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M260.5 66.5 h3.5 l1.5 -2.5 h5 l1.5 2.5 h3.5 v9 h-15 z"/><circle cx="268" cy="70.5" r="2.6"/></g><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M286.4 65.6 a6.8 6.8 0 1 0 9.2 0 M291 62.5 v7"/></g><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M308 73 a7 7 0 1 0 1.5 -8 M308.5 62 v4 h4"/></g><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="330" y="63.5" width="9" height="13" rx="2"/><rect x="341" y="65.5" width="4" height="9" rx="1.5"/></g><g fill="none" stroke="var(--baricon)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M353.5 76.5 v-7 l6.5 -6 l6.5 6 v7 z"/></g>
