<circle cx="204" cy="255" r="16" fill="#FFFFFF" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2.2"/>
<rect x="130" y="105" width="208" height="5" rx="2.5" fill="#D2EDF5"/>
<circle cx="128" cy="26" r="12" fill="var(--badge)"/><text x="128" y="31" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">1</text><circle cx="194" cy="26" r="12" fill="var(--badge)"/><text x="194" y="31" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">2</text><circle cx="302" cy="26" r="12" fill="var(--badge)"/><text x="302" y="31" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">3</text><circle cx="56" cy="108" r="12" fill="var(--ice)"/><text x="56" y="113" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onice)">4</text><circle cx="56" cy="255" r="12" fill="var(--badge)"/><text x="56" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">5</text><circle cx="56" cy="464" r="12" fill="var(--badge)"/><text x="56" y="469" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">6</text>
<path d="M68 108 H130 M68 255 H188 M68 464 H119" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="3 4"/>
<text x="446" y="78" font-size="13" font-weight="700" letter-spacing="1.4" fill="var(--accent)">THE MIRRORLY WINDOW</text>
<circle cx="458" cy="124" r="12" fill="var(--badge)"/><text x="458" y="129" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">1</text><text x="486" y="124" font-size="16" font-weight="600" fill="var(--ink)">Window buttons</text><text x="486" y="146" font-size="14" fill="var(--soft)">Close, minimise, and step through four sizes.</text>
<circle cx="458" cy="196" r="12" fill="var(--badge)"/><text x="458" y="201" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">2</text><text x="486" y="196" font-size="16" font-weight="600" fill="var(--ink)">Copied on your iPhone</text><text x="486" y="218" font-size="14" fill="var(--soft)">Photos and files you copy on the phone appear here.</text><text x="486" y="238" font-size="14" fill="var(--soft)">Drag the chip into Explorer or onto the desktop.</text>
<circle cx="458" cy="288" r="12" fill="var(--badge)"/><text x="458" y="293" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">3</text><text x="486" y="288" font-size="16" font-weight="600" fill="var(--ink)">Buttons for the phone</text><text x="486" y="310" font-size="14" fill="var(--soft)">Record, screenshot, disconnect, rotate, App Switcher, Home.</text><text x="486" y="330" font-size="14" fill="var(--soft)">The bar appears when you point at the window.</text>
<circle cx="458" cy="380" r="12" fill="var(--ice)"/><text x="458" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onice)">4</text><text x="486" y="380" font-size="16" font-weight="600" fill="var(--ink)">The top edge stays free</text><text x="486" y="402" font-size="14" fill="var(--soft)">The bar sits above the screen, never on it, so you can</text><text x="486" y="422" font-size="14" fill="var(--soft)">still pull down Control Center and notifications.</text>
<circle cx="458" cy="472" r="12" fill="var(--badge)"/><text x="458" y="477" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">5</text><text x="486" y="472" font-size="16" font-weight="600" fill="var(--ink)">Instant touch dot</text><text x="486" y="494" font-size="14" fill="var(--soft)">Shows where you clicked before the iPhone responds.</text>
<circle cx="458" cy="544" r="12" fill="var(--badge)"/><text x="458" y="549" font-size="13" font-weight="700" text-anchor="middle" fill="var(--onbadge)">6</text><text x="486" y="544" font-size="16" font-weight="600" fill="var(--ink)">Transfer messages</text><text x="486" y="566" font-size="14" fill="var(--soft)">Copying, pasting and saving, at a glance.</text>
</svg>
