    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
<linearGradient id="wall" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#23282E"/><stop offset="0.5" stop-color="#37525F"/><stop offset="1" stop-color="#8DC2D6"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0E11" flood-opacity="0.30"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0B0E11" flood-opacity="0.28"/></filter>
<clipPath id="screen"><rect x="96" y="104" width="276" height="462" rx="38"/></clipPath>
  </defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)" stroke="var(--cardline)"/>
