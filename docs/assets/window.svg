<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0E3B8C"/>
      <stop offset="0.5" stop-color="#5B2BC9"/>
      <stop offset="1" stop-color="#D02670"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#141a35"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="screen"><rect x="118" y="104" width="250" height="462" rx="38"/></clipPath>
  </defs>

  <rect width="960" height="600" rx="24" fill="url(#bg)"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="104" y="44" width="278" height="536" rx="46" fill="#1C1C20"/>
  </g>
  <!-- Bar above the screen -->
  <path d="M104 90 V70 a26 26 0 0 1 26 -26 h226 a26 26 0 0 1 26 26 V90 z" fill="#28282D"/>
  <rect x="104" y="80" width="278" height="16" fill="#28282D"/>
  <circle cx="128" cy="68" r="7" fill="#FF5F57"/>
  <circle cx="150" cy="68" r="7" fill="#FEBC2E"/>
  <circle cx="172" cy="68" r="7" fill="#28C840"/>
  <rect x="190" y="55" width="86" height="26" rx="13" fill="#4C61FA"/>
  <rect x="200" y="62" width="11" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="218" y="73" font-size="12.5" font-weight="600" fill="#fff">3 photos</text>
  <!-- rotate, switcher, home glyphs -->
  <g fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M283.5 63.5 a7 7 0 1 0 9 0 M288 59.5 v7"/>
    <path d="M305 72 a7 7 0 1 0 2 -8 M305 60 v5 h5"/>
    <rect x="326" y="61" width="9" height="13" rx="2"/>
    <rect x="337" y="63" width="5" height="9" rx="1.5"/>
    <path d="M352 75 v-7 l7 -6 l7 6 v7 z"/>
  </g>

  <!-- Screen -->
  <g clip-path="url(#screen)">
    <rect x="118" y="104" width="250" height="462" fill="url(#wall)"/>
    <text x="150" y="134" font-size="14" font-weight="600" fill="#fff">9:41</text>
    <g fill="#fff"><rect x="318" y="124" width="18" height="9" rx="2.5" fill-opacity="0.9"/><rect x="337" y="127" width="2" height="4" rx="1" fill-opacity="0.9"/></g>
    <g>
      <rect x="140" y="164" width="46" height="46" rx="11" fill="#34C759"/>
      <rect x="198" y="164" width="46" height="46" rx="11" fill="#FFFFFF"/>
      <rect x="256" y="164" width="46" height="46" rx="11" fill="#FF9500"/>
      <rect x="314" y="164" width="46" height="46" rx="11" fill="#0A84FF"/>
      <rect x="140" y="232" width="46" height="46" rx="11" fill="#FF375F"/>
      <rect x="198" y="232" width="46" height="46" rx="11" fill="#5E5CE6"/>
      <rect x="256" y="232" width="46" height="46" rx="11" fill="#FFD60A"/>
      <rect x="314" y="232" width="46" height="46" rx="11" fill="#1C1C1E"/>
      <rect x="140" y="300" width="46" height="46" rx="11" fill="#64D2FF"/>
      <rect x="198" y="300" width="46" height="46" rx="11" fill="#30D158"/>
      <rect x="256" y="300" width="46" height="46" rx="11" fill="#BF5AF2"/>
      <rect x="314" y="300" width="46" height="46" rx="11" fill="#FF9F0A"/>
    </g>
    <!-- toast -->
    <rect x="128" y="448" width="230" height="32" rx="16" fill="#18181B" fill-opacity="0.93"/>
    <text x="243" y="469" text-anchor="middle" font-size="12" fill="#fff">3 photos copied · drag it from the bar</text>
    <!-- dock -->
    <rect x="132" y="494" width="222" height="58" rx="22" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="146" y="502" width="42" height="42" rx="10" fill="#34C759"/>
    <rect x="198" y="502" width="42" height="42" rx="10" fill="#0A84FF"/>
    <rect x="250" y="502" width="42" height="42" rx="10" fill="#FFFFFF"/>
    <rect x="302" y="502" width="42" height="42" rx="10" fill="#FF9500"/>
    <rect x="203" y="557" width="80" height="4.5" rx="2.25" fill="#fff" fill-opacity="0.9"/>
  </g>
  <!-- touch dot -->
  <circle cx="221" cy="255" r="16" fill="#FFFFFF" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2.2"/>
  <!-- free top edge highlight -->
  <rect x="150" y="105" width="186" height="5" rx="2.5" fill="#6EE7B7" fill-opacity="0.9"/>

  <!-- Number badges on the mockup -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0D1226">
    <circle cx="150" cy="32" r="12" fill="#FFFFFF"/><text x="150" y="37">1</text>
    <circle cx="233" cy="32" r="12" fill="#FFFFFF"/><text x="233" y="37">2</text>
    <circle cx="325" cy="32" r="12" fill="#FFFFFF"/><text x="325" y="37">3</text>
    <circle cx="94" cy="108" r="12" fill="#6EE7B7"/><text x="94" y="113">4</text>
    <circle cx="94" cy="255" r="12" fill="#FFFFFF"/><text x="94" y="260">5</text>
    <circle cx="94" cy="464" r="12" fill="#FFFFFF"/><text x="94" y="469">6</text>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="3 4">
    <path d="M106 255 H203"/>
    <path d="M106 464 H140"/>
    <path d="M106 108 H150"/>
  </g>

  <!-- Legend -->
  <text x="446" y="78" font-size="13" font-weight="700" letter-spacing="1.6" fill="#7C8BC9">THE MIRRORLY WINDOW</text>
  <g font-size="16">
    <g transform="translate(446 112)">
      <circle cx="12" cy="12" r="12" fill="#FFFFFF"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">1</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">Window buttons</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">Close, minimise, and step through four sizes.</text>
    </g>
    <g transform="translate(446 184)">
      <circle cx="12" cy="12" r="12" fill="#FFFFFF"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">2</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">Copied on your iPhone</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">Photos and files you copy on the phone appear here.</text>
      <text x="40" y="54" font-size="14" fill="#A3ADD6">Drag the chip into Explorer or onto the desktop.</text>
    </g>
    <g transform="translate(446 276)">
      <circle cx="12" cy="12" r="12" fill="#FFFFFF"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">3</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">Disconnect · Rotate · App Switcher · Home</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">The bar appears when you point at the window.</text>
    </g>
    <g transform="translate(446 348)">
      <circle cx="12" cy="12" r="12" fill="#6EE7B7"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">4</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">The top edge stays free</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">The bar sits above the screen, never on it, so you can</text>
      <text x="40" y="54" font-size="14" fill="#A3ADD6">still pull down Control Center and notifications.</text>
    </g>
    <g transform="translate(446 440)">
      <circle cx="12" cy="12" r="12" fill="#FFFFFF"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">5</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">Instant touch dot</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">Shows where you clicked before the iPhone responds.</text>
    </g>
    <g transform="translate(446 512)">
      <circle cx="12" cy="12" r="12" fill="#FFFFFF"/><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#0D1226">6</text>
      <text x="40" y="12" font-weight="600" fill="#FFFFFF">Transfer messages</text>
      <text x="40" y="34" font-size="14" fill="#A3ADD6">Copying, pasting and saving, at a glance.</text>
    </g>
  </g>
</svg>
