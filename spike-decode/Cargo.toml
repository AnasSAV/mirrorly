[package]
name = "spike-decode"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Phase 0: FFmpeg d3d11va HEVC decode latency benchmark"

[[bin]]
name = "s4_decode"
path = "src/main.rs"

[dependencies]
ffmpeg-sys-next = { version = "=9.0.1", default-features = false, features = ["avcodec"] }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi"] }
anyhow.workspace = true
clap.workspace = true
